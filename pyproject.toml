[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-sync"
version = "0.1.0"
description = "Garmin International to China wellness compare tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "garminconnect>=0.3.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
garmin-sync = "garmin_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
